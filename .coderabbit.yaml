# CodeRabbit 配置：所有改动推到 dev，经 PR（dev → main）审查，低风险才合并
language: zh-CN
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  auto_review:
    enabled: true
    base_branches:
      - main
  path_filters:
    - "!**/pnpm-lock.yaml"
    - "!**/Cargo.lock"
    - "!apps/desktop/src-tauri/icons/**"
    # 第三方 lore-glass 组件源码（MIT），改动登记在 apps/desktop/src/components/ui/README.md
    - "!apps/desktop/src/components/ui/glass.tsx"
    - "!apps/desktop/src/components/ui/glass-motion.ts"
    - "!apps/desktop/src/components/ui/glass-surface.tsx"
    - "!apps/desktop/src/components/ui/glass-webgl.ts"
    - "!apps/desktop/src/components/ui/glass-button.tsx"
    - "!apps/desktop/src/components/ui/glass-switch.tsx"
    - "!apps/desktop/src/components/ui/glass-slider.tsx"
    # agent-core/ 是上游源码（git subtree），不逐行审查；本项目的改动统一登记在 agent-core/PATCHES.md
    - "!agent-core/packages/**"
    - "!agent-core/package-lock.json"
    - "!agent-core/nix/**"
    - "!agent-core/scripts/**"
    # 上游自带的开发工具、CI、文档与根配置同样不审查（仅 PATCHES.md 是本项目文件）
    - "!agent-core/.*/**"
    - "!agent-core/.*"
    - "!agent-core/*.json"
    - "!agent-core/*.ts"
    - "!agent-core/*.sh"
    - "!agent-core/*.bat"
    - "!agent-core/*.ps1"
    - "!agent-core/flake.*"
    - "!agent-core/LICENSE"
    - "!agent-core/AGENTS.md"
    - "!agent-core/CONTRIBUTING.md"
    - "!agent-core/README.md"
    - "!agent-core/SECURITY.md"
  path_instructions:
    - path: "**/*"
      instructions: |
        以仓库根目录的 AGENTS.md 与 docs/技术方案-V5.3.md 为准审查：两协议约束（C1）、数据目录约束（C2）、
        命名规则（agent-core/ 之外不得出现上游名称）、依赖锁定精确稳定版、前端仅静态导出且只有
        src/lib/platform/tauri/ 可以 import @tauri-apps/*。
