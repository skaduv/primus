[package]
name = "primus"
version = "0.0.1"
edition = "2024"
rust-version = "1.99"
description = "乾元（Primus）薄壳"

[lib]
name = "primus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
# P0 第 1 周只引入空壳所需依赖；其余依赖（tokio、rusqlite、notify、gix、windows 等）
# 随对应模块落地时再加入，版本以技术方案第 2.4 节为准。
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-single-instance = "=2.5.4"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[profile.release]
lto = true
codegen-units = 1
strip = true
