[package]
name = "primus"
version = "0.0.2"
edition = "2024"
rust-version = "1.99"
description = "乾元（Primus）薄壳"

[lib]
name = "primus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
# P0 第 1 周只引入空壳所需依赖；其余依赖（tokio、rusqlite、notify、gix、windows 等）
# 随对应模块落地时再加入，版本以技术方案第 2.4 节为准。
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-single-instance = "=2.5.4"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["raw_value"] }

# Windows 平台层（第 4.3 节 ACL、第 3.7 节修复引导、第 2.2 节 Job Object）：只用 windows-sys 的原始 FFI，版本见技术方案第 2.4 节
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_JobObjects",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = true
codegen-units = 1
strip = true
