# cargo-nextest 配置（技术方案第 18 章：薄壳单测用 cargo-nextest）
# 本地：cargo nextest run；CI：cargo nextest run --profile ci（不提前中止，并输出 JUnit 报告）
# nextest 不运行文档测试，doctest 另用 cargo test --doc。

[profile.default]
fail-fast = true
# 单个测试超过 30 秒标记为慢，连续 4 个周期（2 分钟）仍未结束则终止
slow-timeout = { period = "30s", terminate-after = 4 }

[profile.ci]
# CI 上跑完全部测试再汇总失败，便于一次看清所有问题
fail-fast = false
failure-output = "immediate-final"
slow-timeout = { period = "60s", terminate-after = 5 }

[profile.ci.junit]
# 输出到 target/nextest/ci/junit.xml，CI 作为构件上传
path = "junit.xml"

# 吞吐验收（rpc_bridge 10MB/s）对 CPU 争用敏感：与其他测试并行时在 CI 上曾测出 4.8 MB/s 而误报，
# 让它独占全部测试线程运行
[[profile.default.overrides]]
filter = "test(=rpc_bridge::tests::sustains_10mb_per_second_without_loss)"
threads-required = "num-test-threads"
