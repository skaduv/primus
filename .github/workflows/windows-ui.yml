# 乾元 Primus Windows 原生界面（apps/windows，WinUI 3）构建与预览
# - apps/windows 下任何改动推到 dev / main、或指向 main 的 PR，都在 windows-2025 上编译 x64 可执行文件
# - 编译后实际启动应用、等开场动画结束截取主窗口，截图与可运行的压缩包都作为构建产物上传
# - 推送到 dev / main 时，把最新截图发布到 GitHub Pages，打开固定地址即可查看最新构建的界面
name: Windows UI 预览

on:
  push:
    branches: [dev, main]
    paths:
      - "apps/windows/**"
      - ".github/workflows/windows-ui.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/windows/**"
      - ".github/workflows/windows-ui.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ui-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  build:
    name: 编译 · 启动截图（WinUI 3 · x64）
    runs-on: windows-2025
    defaults:
      run:
        shell: pwsh
        working-directory: apps/windows
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: "10.0.x"

      # 预览构建用免安装形态（WindowsPackageType=None + Windows App SDK 自包含），不需要 MSIX 签名即可直接运行；
      # 关闭裁剪与 ReadyToRun，编译更快，也避免裁剪误删 XAML 反射用到的类型
      - name: 编译（dotnet publish · win-x64 · 免安装）
        run: >
          dotnet publish Primus.csproj
          -c Release
          -p:Platform=x64
          -r win-x64
          --self-contained true
          -p:WindowsPackageType=None
          -p:WindowsAppSDKSelfContained=true
          -p:PublishTrimmed=false
          -p:PublishReadyToRun=false
          -o "$env:RUNNER_TEMP/primus-windows"

      - name: 启动应用并截图
        run: >
          ./tools/capture-preview.ps1
          -Exe "$env:RUNNER_TEMP/primus-windows/Primus.exe"
          -OutDir "$env:RUNNER_TEMP/preview"

      - name: 生成预览页
        env:
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message || github.event.pull_request.title || '' }}
          REF_NAME: ${{ github.head_ref || github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          $out = "$env:RUNNER_TEMP/preview"
          $sha = $env:COMMIT_SHA.Substring(0, 7)
          $msg = [System.Net.WebUtility]::HtmlEncode(($env:COMMIT_MSG -split "`n")[0])
          $time = (Get-Date).ToUniversalTime().AddHours(8).ToString("yyyy-MM-dd HH:mm")
          $html = @"
          <!doctype html>
          <html lang="zh-CN">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>乾元 Primus · Windows 界面预览</title>
          <style>
            body { margin: 0; font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif; background: #f3f3f3; color: #1b1b1b; }
            main { max-width: 1100px; margin: 0 auto; padding: 32px 20px 48px; }
            h1 { font-size: 22px; margin: 0 0 6px; }
            p.meta { margin: 0 0 24px; color: #5f5f5f; font-size: 14px; }
            a { color: #0067c0; }
            img { display: block; max-width: 100%; height: auto; border-radius: 8px; box-shadow: 0 8px 32px rgba(0,0,0,.18); margin: 0 auto; }
            details { margin-top: 28px; }
          </style>
          </head>
          <body>
          <main>
            <h1>乾元 Primus · Windows 界面预览</h1>
            <p class="meta">分支 $env:REF_NAME · 提交 $sha · $msg · 构建于 $time（北京时间）· <a href="$env:RUN_URL">构建记录与可运行包下载</a></p>
            <img src="main.png?v=$sha" alt="Primus 主窗口截图">
            <details><summary>整屏截图</summary><img src="desktop.png?v=$sha" alt="整屏截图"></details>
          </main>
          </body>
          </html>
          "@
          Set-Content -Path "$out/index.html" -Value $html -Encoding utf8

      - name: 上传截图
        uses: actions/upload-artifact@v7.0.2
        with:
          name: primus-windows-preview
          path: ${{ runner.temp }}/preview

      - name: 上传可运行包（解压后直接运行 Primus.exe）
        uses: actions/upload-artifact@v7.0.2
        with:
          name: primus-windows-x64
          path: ${{ runner.temp }}/primus-windows

      - name: 打包 Pages 内容
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: ${{ runner.temp }}/preview

  pages:
    name: 发布预览到 GitHub Pages
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: windows-ui-pages
      cancel-in-progress: false
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5.0.1
