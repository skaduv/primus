# 乾元 Primus CI（技术方案第 22 章）
# - 每次推送 dev / main 与每个指向 main 的 PR 都在 Windows 上完整编译：x64（windows-2025）与 ARM64（windows-11-arm）
#   两个架构都构建 MSI 并做静默安装 / 卸载与更新服务静默升级冒烟，arm64 的问题在 PR 阶段暴露，而不是发布时
# - 工具链版本全部来自仓库内的锁定文件：.node-version、packageManager（pnpm）、rust-toolchain.toml、
#   以及下方 env 中的 WIX_VERSION；scripts/check-versions.mjs 保证它们与技术方案第 2.4 节一致
name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  WIX_VERSION: "7.0.0"
  # 测试工具（技术方案第 2.4、18 章）：cargo-nextest 跑薄壳单测，tauri-driver 跑 Windows 端到端测试
  CARGO_NEXTEST_VERSION: "0.9.149"
  TAURI_DRIVER_VERSION: "2.1.0"
  # 端到端测试降权运行所需（见 Windows 作业的端到端冒烟步骤）
  GSUDO_VERSION: "2.6.1"
  GSUDO_SHA256: "21130bf178d7b9891207f00bff56f05b6b363ce9cec7b2d084e45fb12ee51f44"
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: 版本基线 · lint · 单测 · 前端构建（Linux）
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.0 # 版本取自 package.json 的 packageManager

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: 版本基线检查
        run: node scripts/check-versions.mjs

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check:forbidden-sdk # 与 Windows 作业相同，尽早失败
      - run: pnpm check:tauri-imports
      - run: pnpm check:type-scale
      - run: pnpm check:icons
      - run: pnpm check:no-title
      - run: pnpm test
      - run: pnpm --filter @primus/desktop typecheck
      - run: pnpm --filter @primus/protocol typecheck # 协议类型与 Core 文档示例的编译期对照
      - run: pnpm --filter @primus/desktop build # 同时生成 Tauri 嵌入的 out/，Rust 单测需要
      - name: 检查静态导出（out/index.html 含首页）
        run: grep -q "乾元 Primus" apps/desktop/out/index.html

      # Core 产物组装（技术方案第 3.2、6.3 节）：同样实际下载并校验默认的 win-x64 运行时（node.exe 只解出、不运行）；
      # Linux 上用当前 node 跑组装好的 dist/agent-core，确认产物自包含、不依赖仓库里的 node_modules
      - name: 构建 Agent Core 并组装 dist/
        run: pnpm build:core
      - name: 已知模型能力表与锁定的模型目录一致（用 build:core 缓存的目录）
        run: pnpm check:model-capabilities
      - name: Agent Core RPC 冒烟（dist/agent-core · 当前 node）
        run: pnpm smoke:core:dist
      # RPC 契约测试（技术方案第 23 章）：真实 Core 产物 + Faux 模型服务，prompt / abort / get_state
      - name: Agent Core RPC 契约测试（dist/agent-core · 当前 node）
        run: pnpm contract:core:dist
      # 被禁 SDK 检查（技术方案第 6.2 节第 2 条、第 22.1 节第 3 步）：构建后再查一遍，此时导入图从前端页面、
      # 第一方扩展（源码与 primus-bundle.js）、Core 打包前入口与 dist/agent-core 产物入口实际遍历，
      # 并检查 CycloneDX SBOM；--strict 要求这些入口与 SBOM 全部存在，缺失即失败
      - name: 构建第一方扩展（primus-bundle.js）
        run: pnpm build:extensions
      - name: 生成 SBOM（CycloneDX：pnpm 工作区 + agent-core）
        run: pnpm build:sbom
      - name: 被禁 SDK 检查（导入图 + SBOM，严格模式）
        run: node scripts/check-forbidden-sdk.mjs --strict
      - name: 被禁 SDK 检查负向自检（经导入图或 SBOM 引入被禁 SDK 时必须失败）
        run: node scripts/check-forbidden-sdk.mjs --self-test
      - name: 上传 SBOM
        uses: actions/upload-artifact@v7.0.2
        with:
          name: sbom-cyclonedx
          path: dist/sbom
          retention-days: 30
          if-no-files-found: error

      - name: Tauri Linux 系统依赖（Rust 单测用）
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Rust 工具链（按 rust-toolchain.toml 安装）
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version

      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: apps/desktop/src-tauri

      - name: 安装 cargo-nextest ${{ env.CARGO_NEXTEST_VERSION }}
        uses: taiki-e/install-action@v2.87.31
        with:
          tool: cargo-nextest@${{ env.CARGO_NEXTEST_VERSION }}

      - name: Rust 单测（cargo-nextest）
        working-directory: apps/desktop/src-tauri
        run: cargo nextest run --locked --all-targets --profile ci

      - name: Rust 文档测试
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked --doc

      - name: 上传 Rust 单测报告（JUnit）
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: nextest-junit-linux
          path: apps/desktop/src-tauri/target/nextest/ci/junit.xml
          if-no-files-found: ignore

      - name: e2e 类型检查
        run: pnpm --filter @primus/e2e typecheck

  windows:
    name: Windows 编译（MSVC · Rust · WiX · x64）
    # 先过 Linux 检查再占用 Windows runner（README「CI 与依赖升级」）
    needs: checks
    runs-on: windows-2025
    # 作业级上限：运行器失联时步骤级 timeout-minutes 与取消都不生效，只有作业级超时能结束（正常约 15 分钟）
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7.0.1

      # Node/pnpm、Rust（含缓存）、WiX 与 pnpm install：与 release.yml 共用同一个 composite action
      - name: 准备 Windows 构建环境（WiX ${{ env.WIX_VERSION }}）
        uses: ./.github/actions/setup-windows-build
        with:
          wix-version: ${{ env.WIX_VERSION }}

      - name: rustfmt
        working-directory: apps/desktop/src-tauri
        run: cargo fmt --check

      - name: 安装 ACL 原生回归（继承硬链接与句柄固定）
        timeout-minutes: 3
        run: pnpm exec vitest run scripts/install-acl-native.test.ts scripts/install-matrix.test.ts

      - name: 安装 ACL 提权回归（可信夹具与空目录替换）
        timeout-minutes: 3
        run: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/install-acl-elevated.test.ps1

      - name: 构建前端（静态导出，供 Tauri 嵌入）
        run: pnpm --filter @primus/desktop build

      - name: clippy
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: 安装 cargo-nextest ${{ env.CARGO_NEXTEST_VERSION }}
        uses: taiki-e/install-action@v2.87.31
        with:
          tool: cargo-nextest@${{ env.CARGO_NEXTEST_VERSION }}

      - name: Rust 单测（cargo-nextest）
        working-directory: apps/desktop/src-tauri
        run: cargo nextest run --locked --all-targets --profile ci

      - name: Rust 文档测试
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked --doc

      - name: 上传 Rust 单测报告（JUnit）
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: nextest-junit-windows
          path: apps/desktop/src-tauri/target/nextest/ci/junit.xml
          if-no-files-found: ignore

      # Agent Core 以 git subtree 引入（第 6.1 节）：用锁文件安装、锁定版本的模型目录，在 Windows 上实际构建
      - name: 构建 Agent Core
        run: pnpm build:core

      - name: Agent Core RPC 冒烟（构建目录 · get_state）
        run: pnpm smoke:core

      - name: Agent Core RPC 契约测试（构建目录）
        run: pnpm contract:core

      # 第 3.2 节安装布局：dist/runtime/node.exe 运行 dist/agent-core/rpc-entry.js（复制到含中文与空格的临时目录）
      - name: Agent Core RPC 冒烟（dist/runtime/node.exe + dist/agent-core）
        run: pnpm smoke:core:dist

      - name: Agent Core RPC 契约测试（dist/runtime/node.exe + dist/agent-core）
        run: pnpm contract:core:dist

      # 内置 node.exe 保留 OpenJS 官方签名、不重签（第 3.3.1 节）；哈希已在构建时校验，这里再验 Authenticode 签名
      - name: 检查内置 node.exe 的官方签名
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature -FilePath dist/runtime/node.exe
          $sig | Format-List Status, StatusMessage
          $sig.SignerCertificate | Format-List Subject, Issuer, NotAfter
          if ($sig.Status -ne 'Valid') { throw "node.exe 签名无效：$($sig.Status) $($sig.StatusMessage)" }
          if ($sig.SignerCertificate.Subject -notmatch 'O="?OpenJS Foundation') { throw "node.exe 签名者不是 OpenJS Foundation：$($sig.SignerCertificate.Subject)" }

      # 内置 Python（ADR 0010）：保留 PSF 官方签名；隔离模式下能启动、pip 可用，PIP_TARGET 装包后能导入
      - name: 检查内置 Python 与 pip
        shell: pwsh
        run: |
          $py = 'dist/runtime/python/python.exe'
          $sig = Get-AuthenticodeSignature -FilePath $py
          $sig | Format-List Status, StatusMessage
          if ($sig.Status -ne 'Valid') { throw "python.exe 签名无效：$($sig.Status) $($sig.StatusMessage)" }
          if ($sig.SignerCertificate.Subject -notmatch 'O="?Python Software Foundation') { throw "python.exe 签名者不是 Python Software Foundation：$($sig.SignerCertificate.Subject)" }
          & $py -c "import sys, ssl, sqlite3; print(sys.version); assert 'site' in sys.modules and any(p.lower().endswith('site-packages') for p in sys.path), sys.path"
          if ($LASTEXITCODE -ne 0) { throw "内置 Python 无法运行" }
          & $py -m pip --version
          if ($LASTEXITCODE -ne 0) { throw "内置 pip 不可用" }
          $pkgs = Join-Path $env:RUNNER_TEMP 'primus-py-pkgs'
          $env:PRIMUS_PYTHON_PACKAGES = $pkgs
          $whl = Get-ChildItem node_modules/.cache/primus-runtime -Filter 'pip-*.whl' | Select-Object -First 1
          & $py -m pip install --no-index --target $pkgs --no-deps $whl.FullName
          if ($LASTEXITCODE -ne 0) { throw "pip install --target 失败" }
          & $py -c "import os, sys; p = os.environ['PRIMUS_PYTHON_PACKAGES']; assert any(os.path.samefile(x, p) for x in sys.path if os.path.isdir(x)), sys.path"
          if ($LASTEXITCODE -ne 0) { throw "sitecustomize 未加入用户包目录" }
          # safe_path 下仍能导入脚本同目录的模块
          $proj = Join-Path $env:RUNNER_TEMP 'primus-py-proj'
          New-Item -ItemType Directory -Force -Path $proj | Out-Null
          Set-Content -LiteralPath (Join-Path $proj 'helper.py') -Value 'X = 1'
          Set-Content -LiteralPath (Join-Path $proj 'main.py') -Value 'import helper; print("main ok", helper.X)'
          & $py (Join-Path $proj 'main.py')
          if ($LASTEXITCODE -ne 0) { throw "python main.py 无法导入同目录模块" }
          # 默认隔离构建安装源码包（构建后端 setuptools 装在 pip 的临时构建环境里，经 PYTHONPATH 注入）
          $sdist = Join-Path $env:RUNNER_TEMP 'primus-py-sdist'
          New-Item -ItemType Directory -Force -Path (Join-Path $sdist 'primus_demo') | Out-Null
          Set-Content -LiteralPath (Join-Path $sdist 'pyproject.toml') -Value "[build-system]`nrequires = [`"setuptools==84.2.1`"]`nbuild-backend = `"setuptools.build_meta`"`n[project]`nname = `"primus-demo`"`nversion = `"0.1`""
          Set-Content -LiteralPath (Join-Path $sdist 'primus_demo/__init__.py') -Value 'Y = 2'
          & $py -B -m pip install --target $pkgs $sdist
          if ($LASTEXITCODE -ne 0) { throw "源码包隔离构建安装失败" }
          & $py -c "import primus_demo; assert primus_demo.Y == 2"
          if ($LASTEXITCODE -ne 0) { throw "源码包安装后无法导入" }
          # sitecustomize 自身在设置字节码策略前已被导入，目录可写（CI 为管理员）时会留下它自己的 .pyc，其余不应写入
          $pyc = Get-ChildItem -LiteralPath dist/runtime/python -Recurse -File -Filter *.pyc | Where-Object { $_.Name -notlike 'sitecustomize.*.pyc' }
          if ($pyc) { throw "安装目录中生成了字节码：$($pyc.FullName -join ', ')" }

      - name: 上传 Core 与运行时产物（dist/，供干净 Windows 机器验收）
        uses: actions/upload-artifact@v7.0.2
        with:
          name: primus-dist-windows
          path: |
            dist/agent-core
            dist/runtime
          retention-days: 7
          if-no-files-found: error

      - name: 构建第一方扩展（primus-bundle.js）
        run: pnpm build:extensions
      - name: 生成 SBOM（CycloneDX）
        run: pnpm build:sbom
      - name: Core 依赖检查（被禁 SDK：导入图 + SBOM，严格模式，第 6.2 节）
        run: node scripts/check-forbidden-sdk.mjs --strict
      - name: 平台边界检查
        run: pnpm check:tauri-imports

      # 第 3.3.1 节：tauri build --no-bundle 编译 Primus.exe、cargo build 编译更新服务 PrimusUpdate.exe → wix build
      # （WiX 7，-culture zh-CN，bindpath app/core/runtime）生成 MSI。不做 Authenticode 代码签名（ADR 0007）；
      # updater 签名用一次性密钥（PRIMUS_REQUIRE_UPDATER_SIGNING=1）：tauri signer 生成并校验 .sig，
      # 两个 exe 内置同一把公钥，后面的更新服务冒烟才能真的验签安装
      - name: 生成一次性 updater 签名密钥
        shell: pwsh
        run: ./scripts/ci-updater-keys.ps1

      - name: 构建 MSI（tauri build --no-bundle → wix build -arch x64）
        run: node scripts/build-msi.mjs --arch x64

      # 文件名与版本、< 120MB（第 16.5 节）、.sha256、MSI 平台（x64;2052）、ServiceInstall、两个 exe 的 PE 架构；写入 PRIMUS_MSI
      - name: 检查安装包
        shell: pwsh
        run: ./scripts/check-installers.ps1 -Arch x64

      - name: 上传安装包
        uses: actions/upload-artifact@v7.0.2
        with:
          name: primus-installers-windows-x64
          path: |
            out/Primus_*_x64_zh-CN.msi
            out/Primus_*_x64_zh-CN.msi.sha256
            out/Primus_*_x64_zh-CN.msi.sig
          retention-days: 7
          if-no-files-found: error

      # gsudo 同时用于 MSI 冒烟：以中完整性级别实际写入 data，验证普通用户（Users 组）可写。
      # WebView2 运行时 150 起，宿主进程以管理员（高完整性级别）运行时会忽略
      # WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS，而 msedgedriver 只能经由它注入 --remote-debugging-port；
      # GitHub 托管运行器以管理员运行，会话因此建不起来（DevToolsActivePort file doesn't exist）。
      # 微软确认属设计行为，做法是用 gsudo 把整条链（wdio → tauri-driver → msedgedriver → Primus.exe）
      # 降到中完整性级别运行。参见 https://github.com/tauri-apps/wry/issues/1782
      - name: 安装 gsudo ${{ env.GSUDO_VERSION }}（降权运行端到端测试）
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "gsudo.portable.zip"
          $dir = Join-Path $env:RUNNER_TEMP "gsudo"
          Invoke-WebRequest -Uri "https://github.com/gerardog/gsudo/releases/download/v$env:GSUDO_VERSION/gsudo.portable.zip" -OutFile $zip
          $hash = (Get-FileHash -Path $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:GSUDO_SHA256) { throw "gsudo.portable.zip 校验失败：$hash" }
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          Join-Path $dir "x64" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          # 降权后的进程不再享有管理员组权限：放开工作区与临时目录（msedgedriver 在此）的读写
          icacls "$env:GITHUB_WORKSPACE" /grant "Everyone:(OI)(CI)F" | Out-Null
          icacls "$env:RUNNER_TEMP" /grant "Everyone:(OI)(CI)F" | Out-Null

      # 第 3.3.2 节验收：静默安装到 Program Files → 布局与 Core 文件哈希、开始菜单快捷方式、WebView2 处理 →
      # data 的 ACL 含 BUILTIN\Users 显式 Modify 且继承，并以中完整性级别（gsudo 降权）实际写入 data、写不进安装目录根 →
      # 用安装后的 node.exe 跑 RPC 冒烟 → 静默卸载，data 及其中文件保留（GitHub 托管运行器以管理员运行）
      - name: MSI 静默安装 / 卸载冒烟
        shell: pwsh
        timeout-minutes: 15
        run: ./scripts/msi-smoke.ps1 -Msi $env:PRIMUS_MSI

      # ADR 0007：同一批二进制换更高的版本号再出两个 MSI（同一把 updater 密钥签 .sig），以中完整性级别经命名管道请求
      # 更新服务：拒绝错签与降级、程序仍在运行时放弃、等程序退出后静默升级、未运行时直接升级，最后卸载清理
      - name: 构建升级测试 MSI
        shell: pwsh
        run: |
          $v = (Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version -replace '-.*$', ''
          $p = $v.Split('.'); $dir = Join-Path $env:RUNNER_TEMP 'upgrade-test'
          $v1 = "$($p[0]).$($p[1]).$([int]$p[2] + 1)"; $v2 = "$($p[0]).$($p[1]).$([int]$p[2] + 2)"
          node scripts/build-upgrade-test-msi.mjs --arch x64 --version $v1 --out-dir $dir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/build-upgrade-test-msi.mjs --arch x64 --version $v2 --out-dir $dir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "PRIMUS_UPGRADE1=$(Join-Path $dir "Primus_${v1}_x64_zh-CN.msi")" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PRIMUS_UPGRADE2=$(Join-Path $dir "Primus_${v2}_x64_zh-CN.msi")" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: 更新服务静默升级冒烟
        shell: pwsh
        timeout-minutes: 20
        run: ./scripts/update-service-smoke.ps1 -Msi $env:PRIMUS_MSI -Upgrade1 $env:PRIMUS_UPGRADE1 -Upgrade2 $env:PRIMUS_UPGRADE2

      # 端到端冒烟（技术方案第 18 章）：tauri-driver 作 WebDriver 服务端，转接与 WebView2 运行时同版本的 msedgedriver
      - name: 安装 tauri-driver ${{ env.TAURI_DRIVER_VERSION }}
        run: cargo install tauri-driver --locked --version ${{ env.TAURI_DRIVER_VERSION }}

      - name: 安装与 WebView2 运行时匹配的 msedgedriver
        shell: pwsh
        run: |
          $guid = '{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}' # WebView2 Evergreen 运行时
          $keys = @(
            "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\$guid",
            "HKLM:\SOFTWARE\Microsoft\EdgeUpdate\Clients\$guid",
            "HKCU:\Software\Microsoft\EdgeUpdate\Clients\$guid"
          )
          $version = $keys | Where-Object { Test-Path $_ } |
            ForEach-Object { (Get-ItemProperty -Path $_ -Name pv -ErrorAction SilentlyContinue).pv } |
            Where-Object { $_ -and $_ -ne '0.0.0.0' } | Select-Object -First 1
          if (-not $version) { throw "未找到 WebView2 运行时版本" }
          Write-Host "WebView2 运行时 $version"
          $dir = Join-Path $env:RUNNER_TEMP "msedgedriver"
          $zip = Join-Path $env:RUNNER_TEMP "edgedriver_win64.zip"
          Invoke-WebRequest -Uri "https://msedgedriver.microsoft.com/$version/edgedriver_win64.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          $driver = Join-Path $dir "msedgedriver.exe"
          & $driver --version
          "PRIMUS_NATIVE_DRIVER=$driver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # 直接调用 wdio，不经 pnpm run 嵌套：pnpm 12 在 Windows 上会等残留的 msedgedriver 进程而挂起
      - name: 端到端冒烟（WebdriverIO + tauri-driver，中完整性级别）
        shell: pwsh
        timeout-minutes: 15
        working-directory: e2e
        run: |
          whoami /groups | Select-String "Mandatory Label"
          gsudo --integrity Medium pwsh -NoProfile -Command "whoami /groups | Select-String 'Mandatory Label'; ./node_modules/.bin/wdio.cmd run wdio.conf.ts; exit `$LASTEXITCODE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  windows-arm64:
    name: Windows ARM64 编译与安装冒烟（windows-11-arm）
    # 与 x64 作业并行；Linux 检查通过后才占用 ARM64 运行器
    needs: checks
    runs-on: windows-11-arm
    # 作业级上限：windows-11-arm 运行器偶发失联，卡在某一步时步骤级 timeout-minutes 与取消都不生效，
    # 不设上限会挂到默认 360 分钟；只有作业级超时能结束（正常约 25–28 分钟）
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7.0.1

      - name: 准备 Windows 构建环境（WiX ${{ env.WIX_VERSION }}）
        uses: ./.github/actions/setup-windows-build
        with:
          wix-version: ${{ env.WIX_VERSION }}

      - name: Rust 主机与目标
        shell: pwsh
        run: |
          rustc -vV
          rustup target list --installed

      - name: 安装 ACL 原生回归（继承硬链接与句柄固定）
        timeout-minutes: 3
        run: pnpm exec vitest run scripts/install-acl-native.test.ts scripts/install-matrix.test.ts

      - name: 安装 ACL 提权回归（可信夹具与空目录替换）
        timeout-minutes: 3
        run: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/install-acl-elevated.test.ps1

      # 内置运行时按架构下载 win-arm64 的 node.exe（哈希锁定在 scripts/node-runtime.json），并在本机原生运行冒烟
      - name: 构建 Agent Core 并组装 dist/（运行时 win-arm64）
        run: node scripts/build-core.mjs --platform win-arm64

      - name: Agent Core RPC 冒烟（dist/runtime/node.exe + dist/agent-core）
        run: pnpm smoke:core:dist

      - name: Agent Core RPC 契约测试（dist/runtime/node.exe + dist/agent-core）
        run: pnpm contract:core:dist

      - name: 检查内置 node.exe 的官方签名与架构
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature -FilePath dist/runtime/node.exe
          $sig | Format-List Status, StatusMessage
          if ($sig.Status -ne 'Valid') { throw "node.exe 签名无效：$($sig.Status) $($sig.StatusMessage)" }
          if ($sig.SignerCertificate.Subject -notmatch 'O="?OpenJS Foundation') { throw "node.exe 签名者不是 OpenJS Foundation：$($sig.SignerCertificate.Subject)" }
          $arch = & dist/runtime/node.exe -p process.arch
          if ($arch -ne 'arm64') { throw "dist/runtime/node.exe 的架构为 $arch，应为 arm64" }
          Write-Host "node.exe：$(& dist/runtime/node.exe --version)（$arch）"

      - name: 检查内置 Python 的官方签名与架构（ADR 0010）
        shell: pwsh
        run: |
          $py = 'dist/runtime/python/python.exe'
          $sig = Get-AuthenticodeSignature -FilePath $py
          if ($sig.Status -ne 'Valid') { throw "python.exe 签名无效：$($sig.Status) $($sig.StatusMessage)" }
          if ($sig.SignerCertificate.Subject -notmatch 'O="?Python Software Foundation') { throw "python.exe 签名者不是 Python Software Foundation：$($sig.SignerCertificate.Subject)" }
          # 读 PE 头的 Machine 字段（0xAA64 = ARM64）；platform.machine() 报的是宿主 CPU，x64 包在 ARM64 上也会通过
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $py))
          $pe = [BitConverter]::ToInt32($bytes, 0x3C)
          $machine = [BitConverter]::ToUInt16($bytes, $pe + 4)
          if ($machine -ne 0xAA64) { throw ("内置 python.exe 的 PE Machine 为 0x{0:X4}，应为 0xAA64（ARM64）" -f $machine) }
          & $py -m pip --version
          if ($LASTEXITCODE -ne 0) { throw "内置 pip 不可用" }

      - name: 构建第一方扩展（primus-bundle.js）
        run: pnpm build:extensions

      - name: 生成一次性 updater 签名密钥
        shell: pwsh
        run: ./scripts/ci-updater-keys.ps1

      - name: 构建 MSI（tauri build --no-bundle → wix build -arch arm64）
        run: node scripts/build-msi.mjs --arch arm64

      - name: 检查安装包（MSI 平台 Arm64;2052、Primus.exe 与 PrimusUpdate.exe 为 ARM64）
        shell: pwsh
        run: ./scripts/check-installers.ps1 -Arch arm64

      - name: 上传安装包
        uses: actions/upload-artifact@v7.0.2
        with:
          name: primus-installers-windows-arm64
          path: |
            out/Primus_*_arm64_zh-CN.msi
            out/Primus_*_arm64_zh-CN.msi.sha256
            out/Primus_*_arm64_zh-CN.msi.sig
          retention-days: 7
          if-no-files-found: error

      # gsudo 便携包含 arm64 版本时用它做中完整性级别写入测试；没有则冒烟脚本只检查 ACL
      - name: 安装 gsudo ${{ env.GSUDO_VERSION }}（中完整性级别写入测试）
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "gsudo.portable.zip"
          $dir = Join-Path $env:RUNNER_TEMP "gsudo"
          Invoke-WebRequest -Uri "https://github.com/gerardog/gsudo/releases/download/v$env:GSUDO_VERSION/gsudo.portable.zip" -OutFile $zip
          $hash = (Get-FileHash -Path $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:GSUDO_SHA256) { throw "gsudo.portable.zip 校验失败：$hash" }
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          $bin = Join-Path $dir "arm64"
          if (Test-Path (Join-Path $bin "gsudo.exe")) {
            $bin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          } else {
            Write-Host "::warning::gsudo 便携包中没有 arm64 版本（$((Get-ChildItem $dir -Directory).Name -join '、')），跳过中完整性级别写入测试"
          }

      - name: MSI 静默安装 / 卸载冒烟
        shell: pwsh
        timeout-minutes: 15
        run: ./scripts/msi-smoke.ps1 -Msi $env:PRIMUS_MSI

      - name: 构建升级测试 MSI
        shell: pwsh
        run: |
          $v = (Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version -replace '-.*$', ''
          $p = $v.Split('.'); $dir = Join-Path $env:RUNNER_TEMP 'upgrade-test'
          $v1 = "$($p[0]).$($p[1]).$([int]$p[2] + 1)"; $v2 = "$($p[0]).$($p[1]).$([int]$p[2] + 2)"
          node scripts/build-upgrade-test-msi.mjs --arch arm64 --version $v1 --out-dir $dir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/build-upgrade-test-msi.mjs --arch arm64 --version $v2 --out-dir $dir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "PRIMUS_UPGRADE1=$(Join-Path $dir "Primus_${v1}_arm64_zh-CN.msi")" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PRIMUS_UPGRADE2=$(Join-Path $dir "Primus_${v2}_arm64_zh-CN.msi")" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: 更新服务静默升级冒烟
        shell: pwsh
        timeout-minutes: 20
        run: ./scripts/update-service-smoke.ps1 -Msi $env:PRIMUS_MSI -Upgrade1 $env:PRIMUS_UPGRADE1 -Upgrade2 $env:PRIMUS_UPGRADE2

  # 安装矩阵（开发计划第 4 周 P0 安装测试）：两个架构 × 两个位置（Program Files、隔离非系统卷，优先 D），
  # 用上面两个作业刚构建的 MSI。每格：静默安装与布局检查（msi-smoke.ps1）→ 附加检查（install-matrix/matrix-checks.ps1：
  # x64 用端到端测试对安装后的 Primus.exe 完成一次含工具调用的对话；新建标准用户启动 App、核对 ACL 与隔离、
  # 用安装后的运行时完成一次 Core 对话；数据都在 <安装目录>\data）→ 静默卸载，data 保留。
  # 模型是本机 Faux 服务（scripts/install-matrix/faux-serve.mjs），不需要任何密钥。PR 上不重复跑（推送 dev / main 时跑）。
  install-matrix:
    name: 安装矩阵（${{ matrix.arch }} · ${{ matrix.location }}）
    if: github.event_name != 'pull_request'
    needs: [windows, windows-arm64]
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
        location: [programfiles, d-drive]
        include:
          - arch: x64
            runner: windows-2025
            gsudo-dir: x64
            gui: true
          - arch: arm64
            runner: windows-11-arm
            gsudo-dir: arm64
            gui: false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: primus-installers-windows-${{ matrix.arch }}
          path: out

      - name: 安装 gsudo ${{ env.GSUDO_VERSION }}
        shell: pwsh
        env:
          GSUDO_ARCH_DIR: ${{ matrix.gsudo-dir }}
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "gsudo.portable.zip"
          $dir = Join-Path $env:RUNNER_TEMP "gsudo"
          Invoke-WebRequest -Uri "https://github.com/gerardog/gsudo/releases/download/v$env:GSUDO_VERSION/gsudo.portable.zip" -OutFile $zip
          $hash = (Get-FileHash -Path $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:GSUDO_SHA256) { throw "gsudo.portable.zip 校验失败：$hash" }
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          $bin = Join-Path $dir $env:GSUDO_ARCH_DIR
          if (Test-Path (Join-Path $bin "gsudo.exe")) {
            $bin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          } else {
            throw "gsudo 便携包中没有 $env:GSUDO_ARCH_DIR 版本；安装矩阵需要它以中完整性级别运行"
          }
          icacls "$dir" /grant '*S-1-5-32-545:(OI)(CI)RX' | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'gsudo 工具目录授权失败' }

      # 端到端对话所需：e2e 依赖、tauri-driver、与 WebView2 运行时同版本的 msedgedriver（同上面 x64 作业）
      - if: ${{ matrix.gui }}
        uses: pnpm/action-setup@v6.1.0
      - if: ${{ matrix.gui }}
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
      - if: ${{ matrix.gui }}
        name: 安装 e2e 依赖
        run: pnpm install --frozen-lockfile --filter "@primus/e2e..."
      - if: ${{ matrix.gui }}
        name: 安装 tauri-driver ${{ env.TAURI_DRIVER_VERSION }}
        run: cargo install tauri-driver --locked --version ${{ env.TAURI_DRIVER_VERSION }}
      - if: ${{ matrix.gui }}
        name: 安装与 WebView2 运行时匹配的 msedgedriver
        shell: pwsh
        run: |
          $guid = '{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $keys = @(
            "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\$guid",
            "HKLM:\SOFTWARE\Microsoft\EdgeUpdate\Clients\$guid",
            "HKCU:\Software\Microsoft\EdgeUpdate\Clients\$guid"
          )
          $version = $keys | Where-Object { Test-Path $_ } |
            ForEach-Object { (Get-ItemProperty -Path $_ -Name pv -ErrorAction SilentlyContinue).pv } |
            Where-Object { $_ -and $_ -ne '0.0.0.0' } | Select-Object -First 1
          if (-not $version) { throw "未找到 WebView2 运行时版本" }
          $dir = Join-Path $env:RUNNER_TEMP "msedgedriver"
          $zip = Join-Path $env:RUNNER_TEMP "edgedriver_win64.zip"
          Invoke-WebRequest -Uri "https://msedgedriver.microsoft.com/$version/edgedriver_win64.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          "PRIMUS_NATIVE_DRIVER=$(Join-Path $dir 'msedgedriver.exe')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          icacls "$dir" /grant '*S-1-5-32-545:(OI)(CI)RX' | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'msedgedriver 工具目录授权失败' }

      - name: 准备安装位置（${{ matrix.location }}）
        shell: pwsh
        run: ./scripts/install-matrix/prepare-location.ps1 -Location ${{ matrix.location }}

      - name: 安装、检查、对话、卸载
        shell: pwsh
        timeout-minutes: 25
        env:
          PRIMUS_MATRIX_GUI: ${{ matrix.gui }}
        run: |
          $msi = Get-ChildItem out -Filter "Primus_*_${{ matrix.arch }}_zh-CN.msi" | Select-Object -First 1
          if (-not $msi) { throw "未找到 ${{ matrix.arch }} 的 MSI" }
          $extra = @{ Gui = ($env:PRIMUS_MATRIX_GUI -eq 'true') }
          ./scripts/msi-smoke.ps1 -Msi $msi.FullName -InstallDir $env:PRIMUS_MATRIX_DIR -LogDir 'C:\PrimusMatrix\out\msi-smoke' -ExtraChecks ./scripts/install-matrix/matrix-checks.ps1 -ExtraChecksArgs $extra

      - name: 上传矩阵日志
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: install-matrix-${{ matrix.arch }}-${{ matrix.location }}
          # 只给一个路径：多个路径会按公共上级目录计算根目录，与工作区不在同一根下（D:\a 对 C:\PrimusMatrix）时上传报错
          path: C:\PrimusMatrix\out
          retention-days: 14
          if-no-files-found: ignore
